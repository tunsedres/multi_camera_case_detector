services:
  packing-detector:
    build: .
    container_name: packing-detector
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Admin Web Panel (WEB_PORT ile değiştirilebilir)
      - "8080:8080"
    volumes:
      # Config + lisans dosyası (read-only)
      - ./config:/app/config:ro
      # Veritabanı + snapshot'lar (kalıcı)
      - ./data:/app/data
      # Loglar
      - ./logs:/app/logs
    environment:
      - TZ=Europe/Istanbul
      # RTSP'yi TCP'ye zorla. UDP (FFmpeg varsayılanı) paket kaybında bozuk NAL
      # unit üretir → decoder çöp okur, kare düşer, o karedeki tespit kaçar.
      # Python tarafında set etmek güvenilmez (cv2 import'undan önce olmalı), bu
      # yüzden ASIL ayar burası. Değiştirirken app/camera_worker.py'deki yedek
      # setdefault ile tutarlı tut.
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|stimeout;5000000|timeout;5000000|max_delay;500000
    # EMNİYET KEMERİ: konteyner bellek tavanı. Bir bellek büyümesi olursa konteyner
    # OOM-kill olur ve 'restart: unless-stopped' geri getirir — HOST (15.6 GB) asla
    # swap thrash'e düşmez. 15.6 GB host'ta 10 GB güvenli üst sınır (panel+OS'a yer
    # bırakır). Çok kamerada gerçek ihtiyaç ölçülüp ayarlanmalı.
    mem_limit: 10g
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Windows Docker Desktop: bridge (varsayılan) çalışır, RTSP outbound sorunsuz.
    # Linux'ta ağ performansı için host network kullanılabilir (o durumda 'ports'
    # satırını kaldır, çünkü host network'te port mapping yoktur):
    #   network_mode: host
