# ============================================================
#  Packing Detector — Ana Konfigürasyon
#  Sırlar (token, şifre) burada DEĞİL .env içinde tutulur.
#  RTSP URL'lerindeki {user}/{pass} .env'deki CAMERA_* ile doldurulur.
# ============================================================

# ---- Kameralar ----
# Kameralar artık SQLite'ta (events.db) tutulur ve Admin Panel'den yönetilir:
#   Panel → Kameralar (/settings/cameras) → ekle / düzenle / sil / aç-kapat.
# RTSP'de kullanıcı/şifre {user}/{pass} olarak girilir; bunlar .env'deki CAMERA_*
# ile doldurulur (sır DB'ye yazılmaz). Bu dosyadaki 'cameras' bölümü yoksayılır.
# Hikvision substream: "/Streaming/Channels/<kanal>2" (düşük çözünürlük, barkod için yeterli)

# ---- Tespit ----
detection:
  # Yöntem: 'paddle' (PaddleOCR — order-name'i okur, en doğru; bu kurulumda kullanılan),
  # 'ocr' (Tesseract — daha hızlı ama rakam karıştırabilir), 'barcode'/'yolo' (pyzbar).
  # NOT: Barkod bu kamera açısında çok küçük; pyzbar/YOLO okuyamadı (test edildi).
  # Tesseract rakam karıştırıyordu (#939146→#839146, yanlış siparişe yazma riski).
  # PaddleOCR aynı videoda 3 etiketi de sıfır yanlış-hane ile okudu.
  mode: paddle
  paddle_model_root: models/paddleocr/whl
  paddle_min_confidence: 0.80      # PaddleOCR güven eşiği (0-1)
  # PAYLAŞILAN PaddleOCR motor havuzu boyutu (kamera başına değil, toplam). Tüm
  # kameralar paylaşır → RAM = size× model. Çok kamera (8) için 2-3 yeterli; tek
  # kamerada 1 bırakılabilir. Arttırınca RAM ve CPU artar.
  paddle_pool_size: 3              # 2→3: yoğun saatte birden çok kamera aynı anda
                                   # okurken havuz doluyordu (2 motor × ~0.9 sn = ~2
                                   # kare/sn tüm sistem). +1 motor eşzamanlılığı artırır.
  yolo_model_path: models/barcode_yolov8s.pt
  yolo_conf: 0.35
  target_fps: 2                    # 1→2: hızlı paketlemede etiket masada 2-3 sn kalıyor;
                                   # 1 fps'te 1-2 OCR geçişi olur, oylama kapalı olunca
                                   # daha fazla kare = etiketi yakalama şansı artar.
  # Tekrar engelleme: 'daily' = aynı sipariş günde 1 kez (kameradan bağımsız),
  # 'window' = aynı sipariş+kamera dedup_window_seconds içinde 1 kez.
  dedup_mode: daily
  dedup_window_seconds: 30         # ('window' modunda) aynı sipariş+kamera tekrar yoksayma
  # Order name formatı: '#' + 6-10 hane. '#' ZORUNLU (opsiyonel değil): etiketin
  # arkasındaki paketleme fişinde telefon vb. '#'siz sayılar var (örn.
  # "0850 222 22 00" → boşluklar atılınca "0850222200" = 10 hane) → '#?' ile bunlar
  # yanlış siparişe yazılıyordu. Gerçek sipariş no'su HER ZAMAN '#' ile başlar.
  order_no_regex: '^#\d{6,10}$'
  add_hash_prefix: true            # regex '#' zorunlu kıldığı için pratikte etkisiz
  ocr_min_confidence: 60           # OCR güven eşiği (0-100); düşük=çok okuma+çok yanlış
  # Çoklu-kare oylama: değer vote_window_seconds içinde min_votes kez okununca onaylanır.
  # KAPALI (min_votes: 1): yoğun saatte hızlı paketlenen etiketler 3 oya ulaşamadan
  # düşüyordu (26 Haziran 23:25–23:38: ~64 sipariş aralığından yalnız 13 yazıldı).
  # Yanlış okuma RİSKSİZ: Shopify'da olmayan no → OrderNotFound → yazılmaz (zararsız).
  # Tek koruma artık paddle_min_confidence (0.80) + zorunlu '#' regex.
  min_votes: 1                     # 1 = oylama kapalı (her okuma anında tetikler)
  vote_window_seconds: 4
  # 'barcode'/'yolo'/'both' modunda hangi barkod tipleri taransın
  symbols: ["EAN13", "CODE128", "QRCODE"]

# ---- Shopify ----
shopify:
  # NOT: Shopify Admin API'si sipariş Timeline'ına YORUM (comment) yazamaz — yalnızca
  # note, tags ve metafield yazılabilir (CommentEvent salt-okunur). Paketleme bilgisini
  # paylaşılan order.note kutusunu kirletmeden tutmak için sadece yapısal metafield'e
  # yazıyoruz. order.note'u tekrar açmak istersen write_to_order_note: true yap.
  write_to_order_note: false       # order.note'a YAZMA (paylaşılan alan; kirletme)
  write_to_metafield: true         # Kamera + zaman damgası burada (yapısal kayıt)
  # Admin panelinde TANIMLI + PINLİ order metafield → sipariş sayfasında görünür.
  # custom.packing_event tanımıyla eşleşir (multi-line text). Tanımsız bir ns/key
  # yazarsan panel gizler. Her tespit aynı kutuya bir satır ekler (üzerine yazmaz).
  metafield_namespace: "custom"
  metafield_key: "packing_event"
  note_template: "📦 [{timestamp}] Paketleme: {camera_name}"
  poll_interval_seconds: 2.0       # ShopifyWorker pending tarama aralığı
  max_retries: 5                   # Başarısız event kaç kez tekrar denensin
  # Paketleme tespit edilince siparişi Shopify'da FULFILLED (kargolandı) işaretle.
  # Açık (OPEN) fulfillment order'lar tüm kalemleriyle fulfill edilir; zaten fulfilled
  # sipariş hata vermez (idempotent — tekrar tespitte sessizce atlanır).
  fulfill_order: false
  # fulfill_order açıkken müşteriye Shopify KARGO BİLDİRİMİ e-postası gönderilsin mi.
  # true: kamera etiketi gördüğü an müşteriye "siparişiniz kargolandı" e-postası gider.
  # Paketleme == kargolama DEĞİLSE false yap (sipariş içeride fulfilled olur, e-posta gitmez).
  notify_customer: true

# ---- Depolama ----
storage:
  db_path: "data/events.db"
  snapshots_enabled: true
  snapshots_dir: "data/snapshots"
  snapshot_retention_days: 90      # 0 = silme
  jpeg_quality: 85

# ---- Bakım (scheduler) ----
maintenance:
  cleanup_interval_hours: 6        # Retention temizliği kaç saatte bir çalışsın
  license_recheck_hours: 12        # Lisans süre/geçerlilik yeniden kontrol aralığı
  # PaddleOCR motorlarını kaç saatte bir geri dönüştür (boş motorları atıp taze kur).
  # enable_mkldnn=False sızıntıyı zaten kaynağında durdurur; bu emniyet kemeri, uzun
  # çalışmada birikebilecek artık native belleği sıfırlar. 0 = kapalı.
  paddle_recycle_hours: 6
  # Periyodik TAM süreç yeniden başlatma (paddle native bellek sızıntısı kesin çözümü).
  # paddlepaddle 2.6.2 her inference'ta ~130 MB/dk native bellek sızdırıyor (üretimde
  # ölçüldü); bu bellek yalnızca SÜREÇ ÇIKINCA bırakılıyor — enable_mkldnn=False ve
  # idle-recycle DURDURMADI. Uptime bu süreyi (dk) geçince süreç nazikçe SIGTERM ile
  # çıkar, Docker restart:unless-stopped taze RSS ile geri getirir (~2-3 sn kesinti).
  # Runway: boot'tan OOM'a ~68 dk → 45 dk güvenli marj. 0 = kapalı.
  max_uptime_minutes: 45

# ---- İzleme / sağlık ----
monitoring:
  # Bir kamera bu kadar saniye frame üretmezse "stale/down" sayılır
  camera_stale_seconds: 60
